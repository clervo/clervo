<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Clervo bounded x402 proof</title>
    <style>
      :root { color-scheme: dark; font: 16px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; background: #080b0d; color: #edf7f8; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; }
      main { width: min(44rem, calc(100% - 2rem)); padding: 2rem; border: 1px solid #29434a; background: #0d1215; }
      h1 { margin-top: 0; font: 600 1.4rem/1.2 system-ui, sans-serif; }
      dl { display: grid; grid-template-columns: 9rem 1fr; gap: .5rem 1rem; }
      dt { color: #8fa6ac; } dd { margin: 0; overflow-wrap: anywhere; }
      button { margin: .75rem .5rem 0 0; padding: .75rem 1rem; border: 1px solid #7ee7f2; color: #eefeff; background: #12343a; font: inherit; cursor: pointer; }
      button[disabled] { cursor: not-allowed; opacity: .45; }
      #approve { border-color: #ffc96b; background: #493611; }
      pre { white-space: pre-wrap; overflow-wrap: anywhere; padding: 1rem; background: #070a0c; border: 1px solid #26353a; min-height: 4rem; }
      .warning { color: #ffc96b; }
    </style>
  </head>
  <body>
    <main>
      <h1>Bounded x402 launch proof</h1>
      <p class="warning">This utility can authorize one real Base USDC payment. Verify every field before approving MetaMask.</p>
      <dl id="bounds"></dl>
      <button id="connect" type="button">1. Connect approved payer</button>
      <button id="challenge" type="button" disabled>2. Verify 402 challenge</button>
      <button id="approve" type="button" disabled>3. Approve one payment</button>
      <pre id="status" role="status" aria-live="polite">Loading guarded configuration…</pre>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
