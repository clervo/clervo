steps:
  - id: release-input
    name: node:24.18.1-bookworm-slim@sha256:235600a8101ab264e117b1768e925532262668dc9b581ef1dd7d96ced463b8e7
    entrypoint: bash
    args:
      - -ceu
      - |
        printf '%s' "$_RELEASE_SHA" | grep -Eq '^[a-f0-9]{40}$'
  - id: acceptance
    name: node:24.18.1-bookworm-slim@sha256:235600a8101ab264e117b1768e925532262668dc9b581ef1dd7d96ced463b8e7
    entrypoint: bash
    env:
      - CLERVO_CLOUD_ACCEPTANCE=true
      - CLERVO_EXPECTED_RELEASE_SHA=$_RELEASE_SHA
    args:
      - -ceu
      - |
        npm ci
        npm run test:stage14
  - id: image
    name: gcr.io/cloud-builders/docker@sha256:f8b08c609fdc392ee6827ff3e1725e4980f7d96bde9f76f4695086405c96c147
    args:
      - build
      - --file
      - Dockerfile
      - --tag
      - us-central1-docker.pkg.dev/$PROJECT_ID/clervo-production/clervo-api:$_RELEASE_SHA
      - .
images:
  - us-central1-docker.pkg.dev/$PROJECT_ID/clervo-production/clervo-api:$_RELEASE_SHA
options:
  requestedVerifyOption: VERIFIED
  logging: CLOUD_LOGGING_ONLY
timeout: 1800s
