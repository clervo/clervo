apiVersion: batch/v1
kind: Job
metadata: {name: clervo-n427s-browser-qualification, namespace: clervo-n427s-staging, labels: {ticket: n4-27s}}
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 180
  ttlSecondsAfterFinished: 600
  template:
    metadata: {labels: {app: clervo-n427s-browser, ticket: n4-27s}}
    spec:
      restartPolicy: Never
      serviceAccountName: clervo-n427s-browser
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext: {runAsNonRoot: true, runAsUser: 65534, runAsGroup: 65534, fsGroup: 65534, seccompProfile: {type: Localhost, localhostProfile: profiles/clervo-n427s-chromium.json}}
      containers:
        - name: browser
          image: __BROWSER_IMAGE__
          env:
            - {name: CLERVO_N427S_GATEWAY, value: "http://clervo-n427s-gateway:8080"}
            - {name: CLERVO_N427S_IMPLEMENTATION_DIGEST, value: "__BROWSER_IMPLEMENTATION_DIGEST__"}
            - {name: CLERVO_N427S_IMAGE_DIGEST, value: "__BROWSER_IMAGE_DIGEST__"}
          resources: {requests: {cpu: "700m", memory: "512Mi"}, limits: {cpu: "1", memory: "1Gi", ephemeral-storage: "1Gi"}}
          securityContext: {allowPrivilegeEscalation: true, readOnlyRootFilesystem: true, capabilities: {drop: [ALL], add: [SETUID, SETGID, SYS_CHROOT]}}
          volumeMounts:
            - {name: temp, mountPath: /tmp}
            - {name: run, mountPath: /run}
      volumes:
        - {name: temp, emptyDir: {medium: Memory, sizeLimit: 256Mi}}
        - {name: run, emptyDir: {medium: Memory, sizeLimit: 32Mi}}
