steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --pull=false
      - --tag=us-central1-docker.pkg.dev/$PROJECT_ID/clervo-sandbox/runner:verified-alpine-process-boundary-20260803
      - .
images:
  - us-central1-docker.pkg.dev/$PROJECT_ID/clervo-sandbox/runner:verified-alpine-process-boundary-20260803
options:
  requestedVerifyOption: VERIFIED
  logging: CLOUD_LOGGING_ONLY
timeout: 900s
