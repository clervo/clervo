apiVersion: batch/v1
kind: Job
metadata:
  name: clervo-n427t-browser-development
  namespace: clervo-n427t-isolated
  labels: {product: clervo, ticket: n4-27t, environment: isolated-qualification}
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 120
  ttlSecondsAfterFinished: 600
  template:
    metadata: {labels: {app: clervo-n427t-browser, ticket: n4-27t}}
    spec:
      restartPolicy: Never
      serviceAccountName: clervo-n427t-browser
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile: {type: Localhost, localhostProfile: profiles/clervo-n427t-chromium.json}
      containers:
        - name: browser
          image: __OWNER_AUTHORIZED_BROWSER_IMAGE_DIGEST__
          env:
            - {name: CLERVO_N427T_GATEWAY, value: "http://clervo-n427t-gateway:8080"}
            - {name: CLERVO_N427T_FIXTURE_BASE_URL, value: "__OWNER_AUTHORIZED_FIXTURE_BASE_URL__"}
            - {name: CLERVO_N427T_IMPLEMENTATION_DIGEST, value: "__FROZEN_IMPLEMENTATION_DIGEST__"}
          resources:
            requests: {cpu: "700m", memory: "512Mi", ephemeral-storage: "256Mi"}
            limits: {cpu: "1", memory: "1Gi", ephemeral-storage: "1Gi"}
          securityContext:
            allowPrivilegeEscalation: true
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL], add: [SETUID, SETGID, SYS_CHROOT]}
          volumeMounts:
            - {name: temp, mountPath: /tmp}
            - {name: run, mountPath: /run}
            - {name: dev-shm, mountPath: /dev/shm}
      volumes:
        - {name: temp, emptyDir: {medium: Memory, sizeLimit: 256Mi}}
        - {name: run, emptyDir: {medium: Memory, sizeLimit: 32Mi}}
        - {name: dev-shm, emptyDir: {medium: Memory, sizeLimit: 256Mi}}
