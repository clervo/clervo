[build-system]
requires = ["setuptools==83.0.0", "wheel==0.47.0"]
build-backend = "setuptools.build_meta"

[project]
name = "clervo-sdk"
version = "0.3.0"
description = "Typed client for live Clervo Search and provider-neutral AI."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Clervo" }]
keywords = ["clervo", "ai-agents", "agent-infrastructure", "search", "sdk"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://clervo.dev/docs/python"
Documentation = "https://clervo.dev/docs/python"
Issues = "https://github.com/clervo/clervo/issues"
Repository = "https://github.com/clervo/clervo"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
license-files = ["LICENSE"]

[tool.setuptools.package-data]
clervo = ["py.typed"]
