apiVersion: v1
kind: Namespace
metadata:
  name: clervo-n427t-isolated
  labels: {product: clervo, ticket: n4-27t, environment: isolated-qualification}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: clervo-n427t-validation
  namespace: clervo-n427t-isolated
  labels: {product: clervo, ticket: n4-27t}
automountServiceAccountToken: false
---
apiVersion: batch/v1
kind: Job
metadata:
  name: clervo-n427t-validation-once
  namespace: clervo-n427t-isolated
  labels: {product: clervo, ticket: n4-27t, environment: isolated-qualification}
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 900
  ttlSecondsAfterFinished: 3600
  template:
    metadata: {labels: {product: clervo, ticket: n4-27t, job: validation-once}}
    spec:
      restartPolicy: Never
      serviceAccountName: clervo-n427t-validation
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: qualification
          image: us-central1-docker.pkg.dev/bloxsniper-prod/clervo-n427t/qualification@sha256:554a865f572123704d352135cd6de1c422d5b2db70e43dd2a724ae0ef123c12e
          env:
            - {name: CLERVO_N427T_FINAL_EXECUTION, value: "authorized_once"}
            - {name: CLERVO_N427T_IMPLEMENTATION_DIGEST, value: "sha256:7abc3fbb960cfbdc206f0218886a7cb7294491c7b7768e6435257cfdc904df34"}
          resources:
            requests: {cpu: "900m", memory: "1Gi", ephemeral-storage: "1Gi"}
            limits: {cpu: "2", memory: "2Gi", ephemeral-storage: "2Gi"}
          securityContext:
            allowPrivilegeEscalation: true
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL], add: [SETUID, SETGID, SYS_CHROOT]}
          volumeMounts:
            - {name: temp, mountPath: /tmp}
            - {name: run, mountPath: /run}
            - {name: dev-shm, mountPath: /dev/shm}
      volumes:
        - {name: temp, emptyDir: {medium: Memory, sizeLimit: 512Mi}}
        - {name: run, emptyDir: {medium: Memory, sizeLimit: 32Mi}}
        - {name: dev-shm, emptyDir: {medium: Memory, sizeLimit: 512Mi}}
