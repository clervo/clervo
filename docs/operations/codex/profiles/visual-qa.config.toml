# Visual QA is deterministic CLI-first. Docker access is guarded; no browser MCP
# is loaded, so it cannot overlap with the Chrome DevTools session.
approval_policy = "never"
sandbox_mode = "danger-full-access"
web_search = "disabled"
model_reasoning_effort = "high"
allow_login_shell = false

[tui]
alternate_screen = "never"
raw_output_mode = true

[shell_environment_policy]
inherit = "core"
ignore_default_excludes = false
exclude = ["*KEY*", "*TOKEN*", "*SECRET*", "*PASSWORD*", "*WALLET*", "*MNEMONIC*", "*PRIVATE*", "GOOGLE_APPLICATION_CREDENTIALS", "AWS_*", "AZURE_*"]

[[hooks.PreToolUse]]
matcher = "^(Bash|apply_patch|mcp__.*)$"

[[hooks.PreToolUse.hooks]]
type = "command"
command = "/workspace/codex-home/studio/bin/clervo-guard-hook"
timeout = 5
statusMessage = "Enforcing visual-QA boundaries"

[tools]
view_image = true
