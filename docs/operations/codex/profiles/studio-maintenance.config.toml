# Full machine-maintenance capability. The credential-minimized environment,
# global forbidden-command rules, and mandatory PreToolUse guard remain active.
approval_policy = "never"
sandbox_mode = "danger-full-access"
web_search = "cached"
model_reasoning_effort = "xhigh"
allow_login_shell = false

[tui]
alternate_screen = "never"
raw_output_mode = false

[shell_environment_policy]
inherit = "core"
ignore_default_excludes = false
exclude = ["*KEY*", "*TOKEN*", "*SECRET*", "*PASSWORD*", "*WALLET*", "*MNEMONIC*", "*PRIVATE*", "GOOGLE_APPLICATION_CREDENTIALS", "AWS_*", "AZURE_*"]

[[hooks.PreToolUse]]
matcher = "^(Bash|apply_patch|mcp__.*)$"

[[hooks.PreToolUse.hooks]]
type = "command"
command = "/workspace/codex-home/studio/bin/clervo-guard-hook"
timeout = 5
statusMessage = "Enforcing Clervo studio boundaries"

[mcp_servers.openaiDeveloperDocs]
url = "https://developers.openai.com/mcp"
enabled = true
required = false
startup_timeout_sec = 10
tool_timeout_sec = 45
default_tools_approval_mode = "auto"
