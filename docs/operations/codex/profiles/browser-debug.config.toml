# Agent commands need host Docker access, while the browser itself is a fresh,
# credential-free container exposed only on loopback and guarded by the hook.
approval_policy = "never"
sandbox_mode = "danger-full-access"
web_search = "disabled"
model_reasoning_effort = "high"
allow_login_shell = false

[shell_environment_policy]
inherit = "core"
ignore_default_excludes = false
exclude = ["*KEY*", "*TOKEN*", "*SECRET*", "*PASSWORD*", "*WALLET*", "*MNEMONIC*", "*PRIVATE*", "GOOGLE_APPLICATION_CREDENTIALS", "AWS_*", "AZURE_*"]

[[hooks.PreToolUse]]
matcher = "^(Bash|apply_patch|mcp__.*)$"

[[hooks.PreToolUse.hooks]]
type = "command"
command = "/workspace/codex-home/studio/bin/clervo-guard-hook"
timeout = 5
statusMessage = "Enforcing isolated browser-debug boundaries"

[mcp_servers.chrome_devtools]
command = "/workspace/codex-home/studio/node_modules/.bin/chrome-devtools-mcp"
args = ["--browserUrl=http://127.0.0.1:9223", "--no-usage-statistics", "--no-performance-crux", "--redact-network-headers"]
env = { "CI" = "1", "CHROME_DEVTOOLS_MCP_NO_UPDATE_CHECKS" = "1", "CHROME_DEVTOOLS_MCP_NO_USAGE_STATISTICS" = "1" }
enabled = true
required = false
startup_timeout_sec = 15
tool_timeout_sec = 90
default_tools_approval_mode = "auto"
