# Design preparation and authorized UI work stay repository-sandboxed. Figma is
# preconfigured but intentionally disabled until owner OAuth and file authority.
approval_policy = "never"
sandbox_mode = "workspace-write"
web_search = "cached"
model_reasoning_effort = "high"
allow_login_shell = false

[tui]
alternate_screen = "never"
raw_output_mode = false

[sandbox_workspace_write]
writable_roots = ["/workspace/clervo-next"]
network_access = false
exclude_tmpdir_env_var = true
exclude_slash_tmp = true

[shell_environment_policy]
inherit = "core"
ignore_default_excludes = false
exclude = ["*KEY*", "*TOKEN*", "*SECRET*", "*PASSWORD*", "*WALLET*", "*MNEMONIC*", "GOOGLE_APPLICATION_CREDENTIALS", "AWS_*", "AZURE_*"]

[mcp_servers.context7]
url = "https://mcp.context7.com/mcp"
enabled = true
required = false
startup_timeout_sec = 10
tool_timeout_sec = 45
default_tools_approval_mode = "auto"

[mcp_servers.figma]
url = "https://mcp.figma.com/mcp"
enabled = false
required = false
startup_timeout_sec = 10
tool_timeout_sec = 45
default_tools_approval_mode = "writes"
