# Keep long Codex transcripts scrollable with the mouse inside tmux.
set-option -g mouse on
set-option -g history-limit 200000

# Ctrl+B, then y toggles mouse capture. Turn it off for terminal-native text
# selection and copying, then toggle it back on for wheel scrolling.
bind-key y set-option -g mouse \; display-message "tmux mouse: #{?mouse,on (wheel scroll),off (native text selection)}"
