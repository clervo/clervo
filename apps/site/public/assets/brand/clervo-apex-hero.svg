<svg xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 64 64"
  role="img"
  aria-labelledby="title desc">
  <title id="title">Clervo Hollow Apex — cinematic</title>
  <desc id="desc">Cinematic Clervo Hollow Apex with restrained glow. Exact locked geometry.</desc>
  <defs>
    <filter id="beamGlow" x="-50%" y="-300%" width="200%" height="700%">
      <feGaussianBlur stdDeviation="1.25" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="apexGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="0.45" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g fill="none" stroke-width="3.1" stroke-linecap="round" filter="url(#beamGlow)">
    <path d="M2.5 39.28H22.5" stroke="#FF3B30"/>
    <path d="M22.5 39.28H41.5" stroke="#00E5FF"/>
    <path d="M41.5 39.28H61.5" stroke="#FFC800"/>
  </g>

  <path d="M32 8L59.5 55H4.5ZM32 23.05L17.75 47.4H46.25Z" fill="#FFFFFF" fill-rule="evenodd" filter="url(#apexGlow)"/>
</svg>
