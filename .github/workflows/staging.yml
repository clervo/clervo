name: Staging readiness

on:
  workflow_dispatch:
    inputs:
      release_id:
        description: Immutable release identifier to validate
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: staging
  cancel-in-progress: false

jobs:
  validate-staging-release:
    name: Validate staging hello release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: staging
    env:
      CLERVO_ENV: staging
      CLERVO_RELEASE_ID: ${{ inputs.release_id }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use pinned Node.js runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Run acceptance gate
        run: npm test
      - name: Prove staging hello service
        run: npm run staging:smoke