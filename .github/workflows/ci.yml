name: Continuous integration

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  acceptance:
    name: Clean install and acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out full history for secret scanning
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Use pinned Node.js runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Run repository acceptance gate
        run: npm test
      - name: Build B12 site for Slice 3 evidence
        if: always()
        run: npm run build --workspace @clervo/site
      - name: Run integrated B12 browser QA
        if: always()
        run: npm run qa:b12 --workspace @clervo/site -- --use-built
      - name: Verify reduced motion and Slice 3 state semantics
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          npm run preview --workspace @clervo/site -- --host 127.0.0.1 --port 4173 > /tmp/clervo-b12-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill "$PREVIEW_PID" 2>/dev/null || true' EXIT
          for _ in $(seq 1 50); do
            if curl -fsS http://127.0.0.1:4173/start/ >/dev/null; then break; fi
            sleep .2
          done
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          import { mkdir, writeFile } from 'node:fs/promises';

          const browser = await chromium.launch({ headless: true, executablePath: '/usr/bin/google-chrome' });
          const page = await browser.newPage({ viewport: { width: 390, height: 844 }, reducedMotion: 'reduce' });
          const consoleErrors = [];
          const pageErrors = [];
          page.on('console', (message) => { if (message.type() === 'error') consoleErrors.push(message.text()); });
          page.on('pageerror', (error) => pageErrors.push(error.message));
          await page.goto('http://127.0.0.1:4173/start/', { waitUntil: 'networkidle' });

          const expectedTones = ['cyan','cyan','cyan','gold','cyan','cyan','gold','cyan','cyan','cyan','gold'];
          const stages = [];
          const failures = [];
          for (let index = 0; index < expectedTones.length; index += 1) {
            await page.locator(`[data-start-stage-button="${index}"]`).click();
            const observation = await page.evaluate(({ index, expectedTone }) => {
              const panel = document.querySelector('.stage-panel');
              const root = document.querySelector('.b12-start');
              const progress = document.querySelector('.b12-start .progress-track i');
              if (!(panel instanceof HTMLElement) || !(root instanceof HTMLElement)) return null;
              const panelRect = panel.getBoundingClientRect();
              const interactive = [...panel.querySelectorAll('button:not([disabled]), a[href], input:not([disabled])')]
                .filter((element) => element instanceof HTMLElement && getComputedStyle(element).display !== 'none')
                .map((element) => {
                  const rect = element.getBoundingClientRect();
                  return { tag: element.tagName, text: (element.textContent ?? '').trim().replace(/\s+/gu, ' ').slice(0, 80), width: rect.width, height: rect.height };
                });
              const tooSmall = interactive.filter(({ width, height }) => width < 43.5 || height < 43.5);
              return {
                index,
                expectedTone,
                actualStage: panel.dataset.stageIndex,
                tone: panel.dataset.tone,
                documentClientWidth: document.documentElement.clientWidth,
                documentScrollWidth: document.documentElement.scrollWidth,
                bodyClientWidth: document.body.clientWidth,
                bodyScrollWidth: document.body.scrollWidth,
                rootClientWidth: root.clientWidth,
                rootScrollWidth: root.scrollWidth,
                rootOverflowX: getComputedStyle(root).overflowX,
                panelContained: panelRect.left >= -1 && panelRect.right <= document.documentElement.clientWidth + 1,
                tooSmall,
                progressBoxShadow: progress instanceof HTMLElement ? getComputedStyle(progress).boxShadow : null,
              };
            }, { index, expectedTone: expectedTones[index] });
            if (observation === null) failures.push(`stage_${index}:missing_panel_or_root`);
            else {
              stages.push(observation);
              if (observation.actualStage !== String(index)) failures.push(`stage_${index}:index=${observation.actualStage}`);
              if (observation.tone !== expectedTones[index]) failures.push(`stage_${index}:tone=${observation.tone}`);
              if (observation.documentScrollWidth > observation.documentClientWidth + 1) failures.push(`stage_${index}:document_overflow=${observation.documentScrollWidth}/${observation.documentClientWidth}`);
              if (observation.bodyScrollWidth > observation.bodyClientWidth + 1) failures.push(`stage_${index}:body_overflow=${observation.bodyScrollWidth}/${observation.bodyClientWidth}`);
              if (!observation.panelContained) failures.push(`stage_${index}:panel_not_contained`);
              if (observation.tooSmall.length) failures.push(`stage_${index}:small_targets=${JSON.stringify(observation.tooSmall)}`);
              if ((index === 2 || index === 5 || index === 9) && observation.progressBoxShadow !== 'none') failures.push(`stage_${index}:reduced_motion_progress_shadow=${observation.progressBoxShadow}`);
            }
          }

          await page.locator('#states .state-button').first().click();
          const semantics = await page.evaluate(() => {
            const activeFailureDot = document.querySelector('#states .state-button.active i');
            const stageDot = document.querySelector('.stage-panel .state-pill i');
            const heroStage = document.querySelector('.b12-start .hero-stage');
            if (!(activeFailureDot instanceof HTMLElement) || !(stageDot instanceof HTMLElement) || !(heroStage instanceof HTMLElement)) return null;
            const apexPseudo = getComputedStyle(heroStage, '::before');
            return {
              requestRed: getComputedStyle(activeFailureDot).backgroundColor,
              verifiedGold: getComputedStyle(stageDot).backgroundColor,
              apexBackground: apexPseudo.backgroundImage,
              apexOpacity: apexPseudo.opacity,
              apexTop: apexPseudo.top,
              apexRight: apexPseudo.right,
              heroStageOverflowX: getComputedStyle(heroStage).overflowX,
              heroStageOverflowY: getComputedStyle(heroStage).overflowY,
              reducedMotionMatches: matchMedia('(prefers-reduced-motion: reduce)').matches,
              documentClientWidth: document.documentElement.clientWidth,
              documentScrollWidth: document.documentElement.scrollWidth,
              bodyClientWidth: document.body.clientWidth,
              bodyScrollWidth: document.body.scrollWidth,
            };
          });
          if (semantics === null) failures.push('semantic_probe_missing_nodes');
          else {
            if (!semantics.reducedMotionMatches) failures.push('reduced_motion_media_not_active');
            if (semantics.requestRed !== 'rgb(255, 59, 48)') failures.push(`request_red=${semantics.requestRed}`);
            if (semantics.verifiedGold !== 'rgb(255, 200, 0)') failures.push(`verified_gold=${semantics.verifiedGold}`);
            if (!semantics.apexBackground.includes('clervo-apex-mono-light.svg')) failures.push(`apex_asset=${semantics.apexBackground}`);
            if (semantics.apexOpacity !== '0.22') failures.push(`apex_opacity=${semantics.apexOpacity}`);
            if (semantics.heroStageOverflowX === 'visible' || semantics.heroStageOverflowY === 'visible') failures.push(`apex_not_contained=${semantics.heroStageOverflowX}/${semantics.heroStageOverflowY}`);
            if (semantics.documentScrollWidth > semantics.documentClientWidth + 1) failures.push(`final_document_overflow=${semantics.documentScrollWidth}/${semantics.documentClientWidth}`);
            if (semantics.bodyScrollWidth > semantics.bodyClientWidth + 1) failures.push(`final_body_overflow=${semantics.bodyScrollWidth}/${semantics.bodyClientWidth}`);
          }

          await page.locator('[data-start-stage-button="0"]').click();
          const cyan = await page.locator('.stage-panel .state-pill i').evaluate((element) => getComputedStyle(element).backgroundColor);
          if (cyan !== 'rgb(0, 229, 255)') failures.push(`execution_cyan=${cyan}`);
          await page.locator('[data-start-stage-button="3"]').click();

          const menu = await page.evaluate(async () => {
            const trigger = document.querySelector('.site-header__menu');
            if (!(trigger instanceof HTMLButtonElement)) return null;
            trigger.click();
            await new Promise((resolve) => setTimeout(resolve, 25));
            const shell = document.querySelector('.mobile-nav');
            const panel = document.querySelector('.mobile-nav__panel');
            if (!(shell instanceof HTMLElement) || !(panel instanceof HTMLElement)) return null;
            const rect = panel.getBoundingClientRect();
            const result = {
              open: shell.classList.contains('is-open') && !shell.hidden,
              expanded: trigger.getAttribute('aria-expanded'),
              contained: rect.left >= -1 && rect.right <= document.documentElement.clientWidth + 1 && rect.top >= -1 && rect.bottom <= window.innerHeight + 1,
            };
            trigger.click();
            return result;
          });
          if (menu === null || !menu.open || menu.expanded !== 'true' || !menu.contained) failures.push(`mobile_menu=${JSON.stringify(menu)}`);

          if (consoleErrors.length) failures.push(`console=${consoleErrors.join('|')}`);
          if (pageErrors.length) failures.push(`page=${pageErrors.join('|')}`);

          await mkdir('apps/site/qa-artifacts/captures', { recursive: true });
          await page.screenshot({ path: 'apps/site/qa-artifacts/captures/start-mobile-390-reduced-motion.png' });
          await writeFile('apps/site/qa-artifacts/reduced-motion.json', JSON.stringify({ stages, semantics, cyan, menu, consoleErrors, pageErrors, failures }, null, 2) + '\n');
          await browser.close();
          if (failures.length) throw new Error(`slice3_reduced_semantics_failed:${failures.join(';')}`);
          NODE
      - name: Upload B12 Slice 3 QA evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: b12-slice3-real-qa
          path: |
            apps/site/qa-artifacts
            /tmp/clervo-b12-preview.log
          if-no-files-found: warn
          retention-days: 3
