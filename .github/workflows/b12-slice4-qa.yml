name: B12 Slice 4 integrated QA

on:
  push:
    branches:
      - design/b12-vault-rebuild

permissions:
  contents: read

jobs:
  slice4:
    name: Build and integrated Slice 4 QA
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out Slice 4 branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Use pinned Node.js runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Build real site
        run: npm run build --workspace @clervo/site
      - name: Run real integrated Slice 4 browser QA
        run: node scripts/site/b12-slice4-qa.mjs
      - name: Record exact evidence head
        run: |
          git rev-parse HEAD > apps/site/qa-artifacts/slice4/HEAD.txt
          git diff --name-status 11c8dd459e6b6f45bf92c5ddd7e9dee53c8c7105...HEAD > apps/site/qa-artifacts/slice4/changed-files.txt
      - name: Upload Slice 4 evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: b12-slice4-owner-review
          path: apps/site/qa-artifacts/slice4
          if-no-files-found: error
          retention-days: 3
