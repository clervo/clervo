name: Verify distribution candidate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: distribution-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clean-onboarding:
    name: Packages and clean onboarding
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use pinned Node.js runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Use supported Python runtime
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.0.0
        with:
          python-version: "3.12"
          cache: false
      - name: Install locked workspace dependencies
        run: npm ci --ignore-scripts
      - name: Verify package contracts and metadata
        run: npm run test:stage13:clients && npm run verify:distribution-release
      - name: Prove clean consumer onboarding
        run: npm run prove:distribution-onboarding
