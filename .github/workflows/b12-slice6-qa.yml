name: B12 Slice 6 integrated QA

on:
  push:
    branches:
      - design/b12-vault-rebuild

permissions:
  contents: read

jobs:
  slice6:
    name: Build and integrated Slice 6 QA
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out Slice 6 branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Use pinned Node.js runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Build real site
        run: |
          set -o pipefail
          npm run build --workspace @clervo/site 2>&1 | tee /tmp/b12-slice6-build.log
      - name: Run real integrated Slice 6 browser QA
        run: node scripts/site/b12-slice6-qa.mjs
      - name: Preserve build evidence
        if: always()
        run: |
          mkdir -p apps/site/qa-artifacts/slice6
          cp /tmp/b12-slice6-build.log apps/site/qa-artifacts/slice6/build.log || true
          git rev-parse HEAD > apps/site/qa-artifacts/slice6/HEAD.txt
          git diff --name-status 176ec4dccead3c3c188bda5d9b2fcf9d35fd286c...HEAD > apps/site/qa-artifacts/slice6/changed-files.txt
      - name: Upload Slice 6 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: b12-slice6-owner-review
          path: apps/site/qa-artifacts/slice6
          if-no-files-found: error
          retention-days: 3

# Final corrected Slice 6 evidence run. Remove this temporary workflow after evidence capture.
