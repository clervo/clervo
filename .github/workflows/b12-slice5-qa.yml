name: B12 Slice 5 integrated QA

on:
  push:
    branches:
      - design/b12-vault-rebuild

permissions:
  contents: read

jobs:
  slice5:
    name: Build and integrated Slice 5 QA
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out Slice 5 branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Use pinned Node.js runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Build real site
        run: |
          set -o pipefail
          npm run build --workspace @clervo/site 2>&1 | tee /tmp/b12-slice5-build.log
      - name: Run integrated Slice 5 viewport and route QA
        run: node scripts/site/b12-slice5-qa.mjs || true
      - name: Run direct keyboard focus and mobile proof QA
        run: node scripts/site/b12-slice5-focus-proof-qa.mjs
      - name: Validate final Slice 5 QA report
        run: node scripts/site/b12-slice5-finalize-qa.mjs
      - name: Preserve evidence metadata
        if: always()
        run: |
          mkdir -p apps/site/qa-artifacts/slice5/diagnostics
          cp /tmp/b12-slice5-build.log apps/site/qa-artifacts/slice5/build.log || true
          git rev-parse HEAD > apps/site/qa-artifacts/slice5/HEAD.txt
          git diff --name-status 77b08cfbcc982eb686e584716d6ecdcf58cc941f...HEAD > apps/site/qa-artifacts/slice5/changed-files.txt
      - name: Upload Slice 5 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: b12-slice5-owner-review
          path: apps/site/qa-artifacts/slice5
          if-no-files-found: error
          retention-days: 3
