name: AI qualification expiry guard

# Check catalog qualification freshness before routes become stale.
# This workflow is read-only; requalification remains a deliberate action and
# is not scheduled here.

on:
  schedule:
    # Run daily off the top-of-hour peak.
    - cron: '14 6 * * *'
  pull_request:
    paths:
      - 'packages/catalog/ai-model-catalog.v1.json'
      - 'scripts/ai/check-qualification-expiry.mjs'
      - '.github/workflows/ai-qualification-expiry.yml'
  push:
    branches:
      - main
    paths:
      - 'packages/catalog/ai-model-catalog.v1.json'
      - 'scripts/ai/check-qualification-expiry.mjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-qualification-expiry-${{ github.ref }}
  cancel-in-progress: true

jobs:
  expiry:
    name: Check route qualification expiry
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use pinned Node.js runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Check qualification expiry horizon
        run: npm run ai:check-expiry
