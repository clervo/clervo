name: B12 Slice 6 QA simplify

on:
  push:
    branches:
      - design/b12-vault-rebuild

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Keep truth review evidence-driven, not brittle string-gated
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/site/b12-slice6-qa.mjs')
          s=p.read_text()
          start=s.index('\nasync function truthAudit(cdp, page) {')
          end=s.index('\nawait mkdir(captures', start)
          s=s[:start]+s[end:]
          s=s.replace(", truthAudit: {}", "")
          old="""    const truth = await truthAudit(cdp, page);\n    report.truthAudit[page] = truth;\n    if (!truth.pass) report.issues.push(`truth_audit:${page}:${truth.details}`);\n"""
          if old not in s:
              raise SystemExit('truth audit call anchor missing')
          s=s.replace(old,'',1)
          s=s.replace("- Truth surfaces audited: ${Object.keys(report.truthAudit).length}\\n", "")
          s=s.replace(" + ${Object.keys(report.truthAudit).length} truth surfaces", "")
          p.write_text(s)
          PY
          node --check scripts/site/b12-slice6-qa.mjs
          git diff --check
          git config user.name "clervo-b12-bot"
          git config user.email "clervo-b12-bot@users.noreply.github.com"
          git add scripts/site/b12-slice6-qa.mjs
          git rm .github/workflows/b12-slice6-qa-simplify.yml
          git commit -m "test(site): keep Slice 6 visual QA evidence-driven"
          git push origin HEAD:design/b12-vault-rebuild
