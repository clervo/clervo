                          "$ref": "#/$defs/hash"
                        },
                        "requestHash": {
                          "$ref": "#/$defs/hash"
                        },
                        "priceVersion": {
                          "type": "string",
                          "pattern": "^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$"
                        },
                        "quoteExpiresAt": {
                          "type": "string",
                          "format": "date-time"
                        }
                      },
                      "additionalProperties": false
                    }
                  },
                  "additionalProperties": false
                }
              },
              "additionalProperties": false
            }
          },
          "extensions": {
            "type": "object",
            "required": [
              "clervo"
            ],
            "properties": {
              "clervo": {
                "type": "object",
                "required": [
                  "mode",
                  "paymentSignatureAccepted",
                  "verificationImplemented",
                  "facilitatorConfigured",
                  "authorizationImplemented",
                  "settlementImplemented",
                  "executionAllowed"
                ],
                "properties": {
                  "mode": {
                    "const": "mock"
                  },
                  "paymentSignatureAccepted": {
                    "const": false
                  },
                  "verificationImplemented": {
                    "const": false
                  },
                  "facilitatorConfigured": {
                    "const": false
                  },
                  "authorizationImplemented": {
                    "const": false
                  },
                  "settlementImplemented": {
                    "const": false
                  },
                  "executionAllowed": {
                    "const": false
                  }
                },
                "additionalProperties": false
              }
            },
            "additionalProperties": false
          }
        },
        "additionalProperties": false
      },
