{
  "openapi": "3.1.1",
  "jsonSchemaDialect": "https://json-schema.org/draft/2020-12/schema",
  "info": {
    "title": "Clervo Search, AI, Secure Sandbox, Prediction Intelligence, Crypto Intelligence API",
    "version": "2026-07-29.1",
    "description": "Publicly callable previews: raw cited Search, bounded paid AI, bounded one-shot Secure Sandbox execution, derived Prediction Intelligence, bounded provider-neutral Crypto Intelligence. Lifecycle and proof state are generated from the probed live registry; unavailable operations fail closed.",
    "contact": {
      "name": "Clervo",
      "email": "mo@clervo.dev",
      "url": "https://github.com/clervo/clervo"
    },
    "x-guidance": "Use POST /v1/search/free for a bounded no-payment sample. Paid routes return x402 v2 exact-scheme and MPP EVM charge challenges before execution. x-payment-info prices are decimal USD discovery values; PAYMENT-REQUIRED carries the binding USDC amount in token atomic units, including a request-specific maximum where pricing is dynamic. Supply the required JSON body and a stable Idempotency-Key, inspect the exact payment requirements, and send either PAYMENT-SIGNATURE for x402 or Authorization: Payment for MPP only after approval. Reuse the same key to recover or replay a completed result without a second charge. Every unsupported capability fails closed.",
    "x-agentcash-guidance": {
      "llmsTxtUrl": "https://api.clervo.dev/llms.txt"
    }
  },
  "paths": {
    "/v1/search/free": {
      "post": {
        "summary": "Execute a bounded search preview",
        "description": "Public idempotent raw web-search sample. Set synthesize to false; synthesized answers are unavailable.",
        "operationId": "searchPreview",
        "parameters": [
          {
            "name": "Idempotency-Key",
            "in": "header",
            "required": true,
            "schema": {
              "type": "string",
              "minLength": 8,
              "maxLength": 128
            },
            "example": "my-unique-key-550e8400"
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "required": [
                  "query",
                  "synthesize"
                ],
                "properties": {
                  "query": {
                    "type": "string",
                    "minLength": 1,
                    "maxLength": 2000,
                    "default": "current x402 protocol documentation"
                  },
                  "maxResults": {
                    "type": "integer",
                    "minimum": 1,
                    "maximum": 10,
                    "default": 3
                  },
                  "synthesize": {
                    "type": "boolean",
                    "const": false,
                    "default": false
                  },
                  "language": {
                    "type": "string",
                    "pattern": "^[a-z]{2,3}(?:-[A-Za-z0-9]{2,8})*$",
                    "default": "en"
                  },
                  "region": {
                    "type": "string",
                    "pattern": "^[A-Z]{2}$",
                    "default": "US"
                  }
                },
                "additionalProperties": false
              },
              "example": {
                "query": "current x402 protocol documentation",
                "maxResults": 3,
                "synthesize": false,
                "language": "en",
                "region": "US"
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Preview completed",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "required": [
                    "operationId",
                    "state",
                    "replayed",
                    "requestHash"
                  ],
                  "properties": {
                    "operationId": {
                      "type": "string"
                    },
                    "state": {
                      "const": "RECEIPTED"
                    },
                    "replayed": {
                      "type": "boolean"
                    },
                    "requestHash": {
                      "type": "string",
                      "pattern": "^sha256:[a-f0-9]{64}$"
                    },
                    "receipt": {
                      "type": "object",
                      "additionalProperties": true
                    },
                    "output": {
                      "type": "object",
                      "properties": {
                        "route": {
                          "type": "object",
                          "required": [
                            "routeId",
                            "qualificationId",
                            "servingAdapters",
                            "degraded",
                            "fallback",
                            "cost"
                          ],
                          "properties": {
                            "routeId": {
                              "type": "string"
                            },
                            "qualificationId": {
                              "type": "string"
                            },
                            "servingAdapters": {
                              "type": "array",
                              "items": {
                                "type": "string"
                              }
                            },
                            "degraded": {
                              "type": "boolean"
                            },
                            "fallback": {
                              "type": "boolean"
                            },
                            "cost": {
                              "type": "object",
                              "additionalProperties": true
                            }
                          },
                          "additionalProperties": true
                        }
                      },
                      "additionalProperties": true
                    },
                    "execution": {
                      "type": "object",
                      "additionalProperties": true
                    }
                  },
                  "additionalProperties": true
                }
              }
            }
          },
          "400": {
            "description": "Invalid request",
            "content": {
              "application/problem+json": {
                "schema": {
                  "type": "object",
                  "description": "Fail-closed RFC 9457-style problem details.",
                  "additionalProperties": true
                }
              }
            }
          },
          "409": {
            "description": "Idempotency conflict",
            "content": {
              "application/problem+json": {
                "schema": {
                  "type": "object",
                  "description": "Fail-closed RFC 9457-style problem details.",
                  "additionalProperties": true
                }
              }
            }
          },
          "422": {
            "description": "Released-client compatibility request selected synthesize=true, which remains unsupported",
            "content": {
              "application/problem+json": {
                "schema": {
                  "type": "object",
                  "description": "Fail-closed RFC 9457-style problem details.",
                  "additionalProperties": true
                }
              }
            }
          },
          "429": {
            "description": "Preview quota exceeded",
            "content": {
              "application/problem+json": {
                "schema": {
                  "type": "object",
                  "description": "Fail-closed RFC 9457-style problem details.",
                  "additionalProperties": true
                }
              }
            }
          },
          "502": {
            "description": "Executor failed closed",
            "content": {
              "application/problem+json": {
                "schema": {
                  "type": "object",
                  "description": "Fail-closed RFC 9457-style problem details.",
                  "additionalProperties": true
                }
              }
            }
          },
          "503": {
            "description": "Requested capability unavailable",
            "content": {
              "application/problem+json": {
                "schema": {
                  "type": "object",
                  "description": "Fail-closed RFC 9457-style problem details.",
                  "additionalProperties": true
                }
              }
            }
          }
        },
        "security": [],
        "tags": [
          "Search"
        ]
      }
    },
    "/v1/search/paid": {
      "post": {
        "summary": "Request or settle a raw Search payment",
        "description": "Returns an exact x402 challenge for raw cited web retrieval. The same idempotency key replays the completed receipt without another charge. Set synthesize to false.",
        "operationId": "searchPaymentChallenge",
        "parameters": [
          {
            "name": "Idempotency-Key",
            "in": "header",
            "required": true,
            "schema": {
              "type": "string",
              "minLength": 8,
              "maxLength": 128
            },
            "example": "my-unique-key-550e8400"
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "required": [
                  "query",
                  "synthesize"
                ],
                "properties": {
                  "query": {
                    "type": "string",
                    "minLength": 1,
                    "maxLength": 2000,
                    "default": "current x402 protocol documentation"
                  },
                  "maxResults": {
                    "type": "integer",
                    "minimum": 1,
                    "maximum": 10,
                    "default": 3
                  },
                  "synthesize": {
                    "type": "boolean",
                    "const": false,
                    "default": false
                  },
                  "language": {
                    "type": "string",
                    "pattern": "^[a-z]{2,3}(?:-[A-Za-z0-9]{2,8})*$",
                    "default": "en"
                  },
                  "region": {
                    "type": "string",
                    "pattern": "^[A-Z]{2}$",
                    "default": "US"
                  }
                },
                "additionalProperties": false
              },
              "example": {
                "query": "current x402 protocol documentation",
                "maxResults": 3,
                "synthesize": false,
                "language": "en",
                "region": "US"
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Raw cited Search completed or replayed",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "required": [
                    "operationId",
                    "state",
                    "replayed",
                    "requestHash"
                  ],
                  "properties": {
                    "operationId": {
                      "type": "string"
                    },
                    "state": {
                      "const": "RECEIPTED"
                    },
                    "replayed": {
                      "type": "boolean"
                    },
                    "requestHash": {
                      "type": "string",
                      "pattern": "^sha256:[a-f0-9]{64}$"
                    },
                    "receipt": {
                      "type": "object",
                      "additionalProperties": true
                    },
                    "output": {
                      "type": "object",
                      "properties": {
                        "route": {
                          "type": "object",
                          "required": [
                            "routeId",
                            "qualificationId",
                            "servingAdapters",
                            "degraded",
                            "fallback",
                            "cost"
                          ],
                          "properties": {
                            "routeId": {
                              "type": "string"
                            },
                            "qualificationId": {
                              "type": "string"
                            },
                            "servingAdapters": {
                              "type": "array",
                              "items": {
                                "type": "string"
                              }
                            },
                            "degraded": {
                              "type": "boolean"
                            },
                            "fallback": {
                              "type": "boolean"
                            },
                            "cost": {
                              "type": "object",
                              "additionalProperties": true
                            }
                          },
                          "additionalProperties": true
                        }
                      },
                      "additionalProperties": true
                    },
                    "execution": {
                      "type": "object",
                      "additionalProperties": true
                    }
                  },
                  "additionalProperties": true
                }
              }
            },
            "headers": {
              "PAYMENT-RESPONSE": {
                "description": "Base64-encoded x402 v2 settlement response when x402 was used.",
                "schema": {
                  "type": "string",
                  "contentEncoding": "base64"
                }
              },
              "Payment-Receipt": {
                "description": "MPP receipt when MPP was used.",
                "schema": {
                  "type": "string"
                }
              },
              "Idempotency-Replayed": {
                "description": "true when the completed logical operation was replayed without another charge.",
                "schema": {
                  "type": "string",
                  "enum": [
                    "true"
                  ]
                }
              }
            }
          },
          "400": {
            "description": "Invalid request",
            "content": {
              "application/problem+json": {
                "schema": {
                  "type": "object",
                  "description": "Fail-closed RFC 9457-style problem details.",
                  "additionalProperties": true
                }
              }
            }
          },
          "402": {
            "description": "x402 or MPP payment required",
            "headers": {
              "PAYMENT-REQUIRED": {
                "schema": {
                  "type": "string",
                  "contentEncoding": "base64"
                }
              },
              "WWW-Authenticate": {
                "schema": {
                  "type": "string"
                }
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "description": "Fail-closed RFC 9457-style problem details.",
                  "additionalProperties": true
                }
              }
            }
          },
          "409": {
            "description": "Idempotency conflict",
            "content": {
              "application/problem+json": {
                "schema": {
                  "type": "object",
                  "description": "Fail-closed RFC 9457-style problem details.",
                  "additionalProperties": true
                }
              }
            }
          },
          "422": {
            "description": "Released-client compatibility request selected synthesize=true, which remains unsupported",
            "content": {
              "application/problem+json": {
                "schema": {
                  "type": "object",
                  "description": "Fail-closed RFC 9457-style problem details.",
                  "additionalProperties": true
                }
              }
            }
          },
          "502": {
            "description": "Mock test execution failed closed",
            "content": {
              "application/problem+json": {
                "schema": {
                  "type": "object",
                  "description": "Fail-closed RFC 9457-style problem details.",
                  "additionalProperties": true
                }
              }
            }
          },
          "503": {
            "description": "Requested capability or settlement unavailable",
            "content": {
              "application/problem+json": {
                "schema": {
                  "type": "object",
                  "description": "Fail-closed RFC 9457-style problem details.",
                  "additionalProperties": true
                }
              }
            }
          }
        },
        "security": [],
        "tags": [
          "Search"
        ],
        "x-payment-info": {
          "price": {
            "mode": "fixed",
            "currency": "USD",
            "amount": "0.006000"
          },
          "protocols": [
            {
              "x402": {}
            },
            {
              "mpp": {
                "method": "evm",
                "intent": "charge",
                "currency": "0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913"
              }
            }
          ]
        }
      }
    },
    "/v1/ai/execute": {
      "post": {
        "summary": "Execute a provider-neutral Clervo AI model",
        "description": "Free models execute without payment within the published quota. Paid models return an exact request-bound x402 or MPP quote before execution. A completed idempotency key replays the same result and, when paid, the same receipt without another charge.",
        "operationId": "aiExecute",
        "parameters": [
          {
            "name": "Idempotency-Key",
            "in": "header",
            "required": false,
            "description": "Stable replay key. When omitted before payment, the service generates one and returns it in the response headers.",
            "schema": {
              "type": "string",
              "minLength": 8,
              "maxLength": 128
            },
            "example": "my-unique-key-550e8400"
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "required": [
                  "model",
                  "input",
                  "maximumOutputTokens"
                ],
                "properties": {
                  "model": {
                    "type": "string",
                    "minLength": 1,
                    "maxLength": 160,
                    "description": "Canonical Clervo model ID or a published stable alias. GET /v1/models is the current catalog authority; catalog state, not this schema, determines callability.",
                    "examples": [
                      "clervo/allam-2-7b",
                      "clervo/code",
                      "clervo/gemma-4-26b-a4b-it"
                    ]
                  },
                  "input": {
                    "type": "object",
                    "required": [
                      "kind",
                      "messages",
                      "responseFormat",
                      "stream"
                    ],
                    "properties": {
                      "kind": {
                        "type": "string",
                        "const": "chat",
                        "default": "chat"
                      },
                      "messages": {
                        "type": "array",
                        "minItems": 1,
                        "maxItems": 128,
                        "default": [
                          {
                            "role": "user",
                            "content": "Explain in one sentence why idempotency matters for paid API retries."
                          }
                        ],
                        "items": {
                          "type": "object",
                          "required": [
                            "role",
                            "content"
                          ],
                          "properties": {
                            "role": {
                              "type": "string",
                              "enum": [
                                "user"
                              ],
                              "default": "user"
                            },
                            "content": {
                              "type": "string",
                              "minLength": 1,
                              "maxLength": 100000,
                              "default": "Explain in one sentence why idempotency matters for paid API retries."
                            }
                          },
                          "additionalProperties": false
                        }
                      },
                      "responseFormat": {
                        "type": "string",
                        "enum": [
                          "text"
                        ],
                        "default": "text"
                      },
                      "stream": {
                        "type": "boolean",
                        "const": false,
                        "default": false
                      }
                    },
                    "additionalProperties": false,
                    "default": {
                      "kind": "chat",
                      "messages": [
                        {
                          "role": "user",
                          "content": "Explain in one sentence why idempotency matters for paid API retries."
                        }
                      ],
                      "responseFormat": "text",
                      "stream": false
                    }
                  },
                  "maximumOutputTokens": {
                    "type": "integer",
                    "minimum": 1,
                    "maximum": 16384,
                    "default": 64
                  }
                },
                "additionalProperties": false
              },
              "example": {
                "model": "clervo/allam-2-7b",
                "input": {
                  "kind": "chat",
                  "messages": [
                    {
                      "role": "user",
                      "content": "Explain in one sentence why idempotency matters for paid API retries."
                    }
                  ],
                  "responseFormat": "text",
                  "stream": false
                },
                "maximumOutputTokens": 64
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Free or paid AI operation completed or replayed; paid results include truthful usage and settlement receipt",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "required": [
                    "operationId",
                    "state",
                    "replayed",
                    "requestHash"
                  ],
                  "properties": {
                    "operationId": {
                      "type": "string"
                    },
                    "state": {
                      "const": "RECEIPTED"
                    },
                    "replayed": {
                      "type": "boolean"
                    },
                    "requestHash": {
                      "type": "string",
                      "pattern": "^sha256:[a-f0-9]{64}$"
                    },
                    "receipt": {
                      "type": "object",
                      "additionalProperties": true
                    },
                    "output": {
                      "type": "object",
                      "properties": {
                        "route": {
                          "type": "object",
                          "required": [
                            "routeId",
                            "qualificationId",
                            "servingAdapters",
                            "degraded",
                            "fallback",
                            "cost"
                          ],
                          "properties": {
                            "routeId": {
                              "type": "string"
                            },
                            "qualificationId": {
                              "type": "string"
                            },
                            "servingAdapters": {
                              "type": "array",
                              "items": {
                                "type": "string"
                              }
                            },
                            "degraded": {
                              "type": "boolean"
                            },
                            "fallback": {
                              "type": "boolean"
                            },
                            "cost": {
                              "type": "object",
                              "additionalProperties": true
                            }
                          },
                          "additionalProperties": true
                        }
                      },
                      "additionalProperties": true
                    },
                    "execution": {
                      "type": "object",
                      "additionalProperties": true
                    }
                  },
                  "additionalProperties": true
                }
              }
            },
            "headers": {
              "PAYMENT-RESPONSE": {
                "description": "Base64-encoded x402 v2 settlement response when x402 was used.",
                "schema": {
                  "type": "string",
                  "contentEncoding": "base64"
                }
              },
              "Payment-Receipt": {
                "description": "MPP receipt when MPP was used.",
                "schema": {
                  "type": "string"
                }
              },
              "Idempotency-Replayed": {
                "description": "true when the completed logical operation was replayed without another charge.",
                "schema": {
                  "type": "string",
                  "enum": [
                    "true"
                  ]
                }
              }
            }
          },
          "400": {
            "description": "Invalid bounded AI request",
            "content": {
              "application/problem+json": {
                "schema": {
                  "type": "object",
                  "description": "Fail-closed RFC 9457-style problem details.",
                  "additionalProperties": true
                }
              }
            }
          },
          "402": {
            "description": "x402 or MPP payment required",
            "headers": {
              "PAYMENT-REQUIRED": {
                "schema": {
                  "type": "string",
                  "contentEncoding": "base64"
                }
              },
              "WWW-Authenticate": {
                "schema": {
                  "type": "string"
                }
              }
            }
          },
          "404": {
            "description": "Requested model ID is not present in the current catalog",
            "content": {
              "application/problem+json": {
                "schema": {
                  "type": "object",
                  "description": "Fail-closed RFC 9457-style problem details.",
                  "additionalProperties": true
                }
              }
            }
          },
          "409": {
            "description": "Idempotency or quote conflict",
            "content": {
              "application/problem+json": {
                "schema": {
                  "type": "object",
                  "description": "Fail-closed RFC 9457-style problem details.",
                  "additionalProperties": true
                }
              }
            }
          },
          "422": {
            "description": "Known model is unavailable, unsellable, or incompatible with the requested input kind",
            "content": {
              "application/problem+json": {
                "schema": {
                  "type": "object",
                  "description": "Fail-closed RFC 9457-style problem details.",
                  "additionalProperties": true
                }
              }
            }
          },
          "429": {
            "description": "Published free-tier quota exhausted; the request is not silently converted into a paid operation",
            "content": {
              "application/problem+json": {
                "schema": {
                  "type": "object",
                  "description": "Fail-closed RFC 9457-style problem details.",
                  "additionalProperties": true
                }
              }
            }
          },
          "503": {
            "description": "No qualified route, capacity, or settlement path is available",
            "content": {
              "application/problem+json": {
                "schema": {
                  "type": "object",
                  "description": "Fail-closed RFC 9457-style problem details.",
                  "additionalProperties": true
                }
              }
            }
          }
        },
        "security": [],
        "tags": [
          "AI"
        ],
        "x-payment-info": {
          "price": {
            "mode": "dynamic",
            "currency": "USD",
            "min": "0.001000",
            "max": "42.500000"
          },
          "protocols": [
            {
              "x402": {}
            },
            {
              "mpp": {
                "method": "evm",
                "intent": "charge",
                "currency": "0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913"
              }
            }
          ]
        }
      }
    },
    "/v1/models": {
      "get": {
        "summary": "List the authoritative provider-neutral Clervo AI catalog",
        "description": "Returns 85 frozen canonical model IDs and 4 stable aliases with capabilities, availability, health, free/paid state, pricing, and commerce metadata. Canonical IDs never silently substitute another model.",
        "operationId": "aiListModels",
        "security": [],
        "responses": {
          "200": {
            "description": "OpenAI-compatible model list with authoritative Clervo commercial metadata",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "required": [
                    "object",
                    "data",
                    "clervo"
                  ],
                  "properties": {
                    "object": {
                      "const": "list"
                    },
                    "data": {
                      "type": "array",
                      "items": {
                        "type": "object",
                        "required": [
                          "id",
                          "object",
                          "owned_by",
                          "clervo"
                        ]
                      }
                    },
                    "clervo": {
                      "type": "object"
                    }
                  }
                }
              }
            }
          }
        },
        "tags": [
          "AI"
        ]
      }
    },
    "/v1/chat/completions": {
      "post": {
        "summary": "Create an OpenAI-compatible chat completion",
        "description": "Thin non-streaming OpenAI Chat Completions compatibility adapter over Clervo AI execution. Free models use the same published quota; paid models return a request-bound x402 or MPP quote before execution. Unsupported non-default controls and stream=true fail closed with 422.",
        "operationId": "openAiChatCompletions",
        "security": [],
        "tags": [
          "AI"
        ],
        "parameters": [
          {
            "name": "Idempotency-Key",
            "in": "header",
            "required": false,
            "description": "Stable replay key. When omitted before payment, the service generates one and returns it in the response headers.",
            "schema": {
              "type": "string",
              "minLength": 8,
              "maxLength": 128
