                  "properties": {
                    "mock": {
                      "const": true
                    },
                    "payable": {
                      "const": false
                    },
                    "clervo": {
                      "type": "object",
                      "required": [
                        "quoteId",
                        "quoteHash",
                        "requestHash",
                        "priceVersion",
                        "quoteExpiresAt"
