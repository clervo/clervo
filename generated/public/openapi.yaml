            "pattern": "^sha256:[a-f0-9]{64}$"
          },
          "state": {
            "enum": [
              "RECEIVED",
              "VALIDATED",
              "QUOTED",
              "PAYMENT_REQUIRED",
              "AUTHORIZED",
              "RESERVED",
              "EXECUTING",
              "EXECUTION_UNKNOWN",
              "EXECUTED",
              "VERIFYING",
              "VERIFIED",
              "SETTLING",
              "SETTLEMENT_UNKNOWN",
              "SETTLED",
              "RECEIPTED",
              "RECONCILING",
              "FAILED"
            ]
          },
          "quoteExpiresAt": {
            "type": "string",
            "format": "date-time"
          },
          "createdAt": {
            "type": "string",
            "format": "date-time"
          },
          "updatedAt": {
            "type": "string",
            "format": "date-time"
          }
        },
        "additionalProperties": false
      },
      "Problem": {
        "$schema": "https://json-schema.org/draft/2020-12/schema",
        "$id": "https://api.clervo.dev/schemas/2026-07-29.1/problem.schema.json",
        "title": "Clervo RFC 9457 problem detail",
        "type": "object",
        "required": [
          "type",
          "title",
          "status",
          "detail",
          "instance",
          "code",
          "retryable"
        ],
        "properties": {
          "type": {
            "type": "string",
            "format": "uri",
            "pattern": "^https://api\\.clervo\\.dev/problems/"
          },
          "title": {
            "type": "string",
            "minLength": 1,
            "maxLength": 160
          },
          "status": {
            "type": "integer",
            "minimum": 400,
            "maximum": 599
          },
          "detail": {
            "type": "string",
            "minLength": 1,
            "maxLength": 2000
          },
          "instance": {
            "type": "string",
            "format": "uri-reference"
          },
          "code": {
            "type": "string",
            "pattern": "^[a-z][a-z0-9_]{2,63}$"
          },
          "operationId": {
            "type": "string",
            "pattern": "^op_[A-Za-z0-9]{20,64}$"
          },
          "retryable": {
            "type": "boolean"
          }
        },
        "additionalProperties": false
      },
      "Quote": {
        "$schema": "https://json-schema.org/draft/2020-12/schema",
        "$id": "https://api.clervo.dev/schemas/2026-07-29.1/quote.schema.json",
        "title": "Clervo maximum-charge quote",
        "$defs": {
          "hash": {
            "type": "string",
            "pattern": "^sha256:[a-f0-9]{64}$"
          },
          "amount": {
            "type": "object",
            "required": [
              "asset",
              "amountAtomic",
              "decimals"
            ],
            "properties": {
              "asset": {
                "type": "string",
                "pattern": "^[A-Za-z0-9][A-Za-z0-9:._/-]{1,127}$"
              },
              "amountAtomic": {
                "type": "string",
                "pattern": "^(?:0|[1-9][0-9]{0,77})$"
              },
              "decimals": {
                "type": "integer",
                "minimum": 0,
                "maximum": 30
              }
            },
            "additionalProperties": false
          }
        },
        "type": "object",
        "required": [
          "contractVersion",
          "quoteId",
          "operationId",
          "productId",
          "requestHash",
          "priceVersion",
          "maximumCharge",
          "issuedAt",
          "expiresAt",
          "quoteHash"
        ],
        "properties": {
          "contractVersion": {
            "const": "2026-07-29.1"
          },
          "quoteId": {
            "type": "string",
            "pattern": "^quote_[A-Za-z0-9]{20,64}$"
          },
          "operationId": {
            "type": "string",
            "pattern": "^op_[A-Za-z0-9]{20,64}$"
          },
          "productId": {
            "type": "string",
            "pattern": "^[a-z][a-z0-9]*(?:\\.[a-z][a-z0-9]*)+$"
          },
          "requestHash": {
            "$ref": "#/$defs/hash"
          },
          "priceVersion": {
            "type": "string",
            "pattern": "^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$"
          },
          "maximumCharge": {
            "$ref": "#/$defs/amount"
          },
          "issuedAt": {
            "type": "string",
            "format": "date-time"
          },
          "expiresAt": {
            "type": "string",
            "format": "date-time"
          },
          "quoteHash": {
            "$ref": "#/$defs/hash"
          }
        },
        "additionalProperties": false
      },
      "RetrievalSynthesis": {
        "$schema": "https://json-schema.org/draft/2020-12/schema",
        "$id": "https://api.clervo.dev/schemas/2026-07-29.1/retrieval-synthesis.schema.json",
        "title": "Clervo bounded citation-preserving retrieval synthesis report",
        "$defs": {
          "invocation": {
            "type": "object",
            "required": [
              "outcome"
            ],
            "properties": {
              "outcome": {
                "enum": [
                  "not_invoked",
                  "succeeded",
                  "failed",
                  "deadline_exceeded",
                  "cancelled",
                  "output_rejected"
                ]
              },
              "failureCode": {
                "enum": [
                  "adapter_failed",
                  "deadline_exceeded",
                  "caller_cancelled",
                  "invalid_model_output"
                ]
              }
            },
            "allOf": [
              {
                "if": {
                  "properties": {
                    "outcome": {
                      "enum": [
                        "not_invoked",
                        "succeeded"
                      ]
                    }
                  },
                  "required": [
                    "outcome"
                  ]
                },
                "then": {
                  "properties": {
                    "failureCode": false
                  }
                }
              },
              {
                "if": {
                  "properties": {
                    "outcome": {
                      "enum": [
                        "failed",
                        "deadline_exceeded",
                        "cancelled",
                        "output_rejected"
                      ]
                    }
                  },
                  "required": [
                    "outcome"
                  ]
                },
                "then": {
                  "required": [
                    "failureCode"
                  ]
                }
              }
            ],
            "additionalProperties": false
          },
          "claim": {
            "type": "object",
            "required": [
              "claimId",
              "text",
              "citationIds"
            ],
            "properties": {
              "claimId": {
                "type": "string",
                "pattern": "^claim_[1-9][0-9]*$"
              },
              "text": {
                "type": "string",
                "minLength": 1,
                "maxLength": 500
              },
              "citationIds": {
                "type": "array",
                "minItems": 1,
                "maxItems": 5,
                "uniqueItems": true,
                "items": {
                  "type": "string",
                  "pattern": "^cite_[A-Za-z0-9]{20,64}$"
                }
              }
            },
            "additionalProperties": false
          },
          "citation": {
            "type": "object",
            "required": [
              "citationId",
              "resultId",
              "canonicalUrl",
              "quote",
              "startOffset",
              "endOffset",
              "observationId",
              "pathId",
              "providerId",
              "sourceOrdinal",
              "rawResponseSha256",
              "fetchId",
              "extractionId",
              "sourceBodySha256",
              "normalizedTextSha256",
              "title",
              "rank"
            ],
            "properties": {
              "citationId": {
                "type": "string",
                "pattern": "^cite_[A-Za-z0-9]{20,64}$"
              },
              "resultId": {
                "type": "string",
                "pattern": "^sr_[A-Za-z0-9]{20,64}$"
              },
              "canonicalUrl": {
                "type": "string",
                "format": "uri",
                "pattern": "^https?://"
              },
              "quote": {
                "type": "string",
                "minLength": 1,
                "maxLength": 1000
              },
              "startOffset": {
                "type": "integer",
                "minimum": 0
              },
              "endOffset": {
                "type": "integer",
                "minimum": 1,
                "maximum": 100000
              },
              "observationId": {
                "type": "string",
                "pattern": "^obs_[A-Za-z0-9_]{20,90}$"
              },
              "pathId": {
                "type": "string",
                "pattern": "^retrieval_[a-z0-9][a-z0-9._-]{2,63}$"
              },
              "providerId": {
                "type": "string",
                "pattern": "^provider_[a-z0-9][a-z0-9._-]{2,63}$"
              },
              "sourceOrdinal": {
                "type": "integer",
                "minimum": 1,
                "maximum": 100
              },
              "rawResponseSha256": {
                "type": "string",
                "pattern": "^sha256:[a-f0-9]{64}$"
              },
              "fetchId": {
                "type": "string",
                "pattern": "^fetch_[A-Za-z0-9]{20,64}$"
              },
              "extractionId": {
                "type": "string",
                "pattern": "^extract_[A-Za-z0-9]{20,64}$"
              },
              "sourceBodySha256": {
                "type": "string",
                "pattern": "^sha256:[a-f0-9]{64}$"
              },
              "normalizedTextSha256": {
                "type": "string",
                "pattern": "^sha256:[a-f0-9]{64}$"
              },
              "title": {
                "type": "string",
                "minLength": 1,
                "maxLength": 512
              },
              "rank": {
                "type": "integer",
                "minimum": 1,
                "maximum": 100
              }
            },
            "additionalProperties": false
          }
        },
        "type": "object",
        "required": [
          "contractVersion",
          "synthesisId",
          "assemblyId",
          "assemblySha256",
          "operationId",
          "query",
          "createdAt",
          "deadlineAt",
          "policyId",
          "evidenceCount",
          "outcome",
          "invocation",
          "claims",
          "citations",
          "synthesisPerformed"
        ],
        "properties": {
          "contractVersion": {
            "const": "2026-07-29.1"
          },
          "synthesisId": {
            "type": "string",
            "pattern": "^syn_[A-Za-z0-9]{20,64}$"
          },
          "assemblyId": {
            "type": "string",
            "pattern": "^asm_[A-Za-z0-9]{20,55}$"
          },
          "assemblySha256": {
            "type": "string",
            "pattern": "^sha256:[a-f0-9]{64}$"
          },
          "operationId": {
            "type": "string",
            "pattern": "^op_[A-Za-z0-9]{20,64}$"
          },
          "query": {
            "type": "string",
            "minLength": 1,
            "maxLength": 2000
          },
          "createdAt": {
            "type": "string",
            "format": "date-time"
          },
          "deadlineAt": {
            "type": "string",
            "format": "date-time"
          },
          "policyId": {
            "const": "retrieval_cited_claims_v1"
          },
          "evidenceCount": {
            "type": "integer",
            "minimum": 0,
            "maximum": 20
          },
          "outcome": {
            "enum": [
              "synthesized",
              "insufficient_evidence",
              "failed",
              "cancelled"
            ]
          },
          "invocation": {
            "$ref": "#/$defs/invocation"
          },
          "answer": {
            "type": "string",
            "minLength": 1,
            "maxLength": 6000
          },
          "claims": {
            "type": "array",
            "maxItems": 10,
            "items": {
              "$ref": "#/$defs/claim"
            }
          },
          "citations": {
            "type": "array",
            "maxItems": 20,
            "items": {
              "$ref": "#/$defs/citation"
            }
          },
          "synthesisPerformed": {
            "type": "boolean"
          }
        },
        "allOf": [
          {
            "if": {
              "properties": {
                "outcome": {
                  "const": "synthesized"
                }
              },
              "required": [
                "outcome"
              ]
            },
            "then": {
              "required": [
                "answer"
              ],
              "properties": {
                "answer": {
                  "type": "string",
                  "minLength": 1,
                  "maxLength": 6000
                },
                "invocation": {
                  "type": "object",
                  "properties": {
                    "outcome": {
                      "const": "succeeded"
                    }
                  },
                  "required": [
                    "outcome"
                  ]
                },
                "claims": {
                  "type": "array",
                  "minItems": 1
                },
                "citations": {
                  "type": "array",
                  "minItems": 1
                },
                "synthesisPerformed": {
                  "const": true
                }
              }
            },
            "else": {
              "properties": {
                "answer": false,
                "claims": {
                  "type": "array",
                  "maxItems": 0
                },
                "citations": {
                  "type": "array",
                  "maxItems": 0
                },
                "synthesisPerformed": {
                  "const": false
                }
              }
            }
          }
        ],
        "additionalProperties": false
      },
      "SearchCacheDisclosure": {
        "$schema": "https://json-schema.org/draft/2020-12/schema",
        "$id": "https://api.clervo.dev/schemas/2026-07-29.1/search-cache-disclosure.schema.json",
        "title": "Clervo search cache freshness and revalidation disclosure",
        "type": "object",
        "required": [
          "policyId",
          "outcome",
          "requestSha256",
          "responseSha256",
          "observedAt",
          "maximumResults",
          "freshnessLifetimeSeconds",
          "ageSeconds",
          "residentAgeSeconds",
          "freshnessRemainingSeconds",
          "revalidationPerformed"
        ],
        "properties": {
          "policyId": {
            "const": "search_cache_disclosure_v1"
          },
          "outcome": {
            "enum": [
              "miss",
              "fresh_hit",
              "stale_revalidated"
            ]
          },
          "requestSha256": {
            "type": "string",
            "pattern": "^sha256:[a-f0-9]{64}$"
          },
          "responseSha256": {
            "type": "string",
            "pattern": "^sha256:[a-f0-9]{64}$"
          },
          "observedAt": {
            "type": "string",
            "format": "date-time"
          },
          "maximumResults": {
            "type": "integer",
            "minimum": 1,
            "maximum": 100
          },
          "freshnessLifetimeSeconds": {
            "type": "integer",
            "minimum": 0,
            "maximum": 31536000
          },
          "ageSeconds": {
            "type": "integer",
            "minimum": 0,
            "maximum": 31536000
          },
          "residentAgeSeconds": {
            "type": "integer",
            "minimum": 0
          },
          "freshnessRemainingSeconds": {
            "type": "integer",
            "minimum": 0,
            "maximum": 31536000
          },
          "revalidationPerformed": {
            "type": "boolean"
          },
          "storedAt": {
            "type": "string",
            "format": "date-time"
          },
          "validatedAt": {
            "type": "string",
            "format": "date-time"
          },
          "previousValidatedAt": {
            "type": "string",
            "format": "date-time"
          }
        },
        "allOf": [
          {
            "if": {
              "properties": {
                "outcome": {
                  "const": "miss"
                }
              },
              "required": [
                "outcome"
              ]
            },
            "then": {
              "properties": {
                "freshnessLifetimeSeconds": {
                  "const": 0
                },
                "ageSeconds": {
                  "const": 0
                },
                "residentAgeSeconds": {
                  "const": 0
                },
                "freshnessRemainingSeconds": {
                  "const": 0
                },
                "revalidationPerformed": {
                  "const": false
                },
                "storedAt": false,
                "validatedAt": false,
                "previousValidatedAt": false
              }
            }
          },
          {
            "if": {
              "properties": {
                "outcome": {
                  "const": "fresh_hit"
                }
              },
              "required": [
                "outcome"
              ]
            },
            "then": {
              "required": [
                "storedAt",
                "validatedAt"
              ],
              "properties": {
                "freshnessLifetimeSeconds": {
                  "type": "integer",
                  "minimum": 1
                },
                "freshnessRemainingSeconds": {
                  "type": "integer",
                  "minimum": 1
                },
                "revalidationPerformed": {
                  "const": false
                },
                "previousValidatedAt": false
              }
            }
          },
          {
            "if": {
              "properties": {
                "outcome": {
                  "const": "stale_revalidated"
                }
              },
              "required": [
                "outcome"
              ]
            },
            "then": {
              "required": [
                "storedAt",
                "validatedAt",
                "previousValidatedAt"
              ],
              "properties": {
                "freshnessLifetimeSeconds": {
                  "type": "integer",
                  "minimum": 1
                },
                "ageSeconds": {
                  "type": "integer",
                  "const": 0
                },
                "revalidationPerformed": {
                  "const": true
                }
              }
            }
          }
        ],
        "additionalProperties": false
      },
      "SearchHttpRequest": {
        "$schema": "https://json-schema.org/draft/2020-12/schema",
        "$id": "https://api.clervo.dev/schemas/2026-07-29.1/search-http-request.schema.json",
        "title": "Clervo bounded search HTTP request",
        "type": "object",
        "required": [
          "query"
        ],
        "properties": {
          "query": {
            "type": "string",
            "minLength": 1,
            "maxLength": 2000
          },
          "maxResults": {
            "type": "integer",
            "minimum": 1,
            "maximum": 10,
            "default": 10
          },
          "synthesize": {
            "type": "boolean",
            "default": false,
            "description": "Public HTTP omission selects false. true is accepted only as a released-client compatibility input and returns search_synthesis_unavailable."
          },
          "language": {
            "type": "string",
            "minLength": 2,
            "maxLength": 35,
            "pattern": "^[a-z]{2,3}(?:-[A-Za-z0-9]{2,8})*$",
            "default": "en"
          },
          "region": {
            "type": "string",
            "pattern": "^[A-Z]{2}$",
            "default": "US"
          }
        },
        "additionalProperties": false
      },
      "SearchHttpResult": {
        "$schema": "https://json-schema.org/draft/2020-12/schema",
        "$id": "https://api.clervo.dev/schemas/2026-07-29.1/search-http-result.schema.json",
        "title": "Clervo search HTTP result envelope",
        "type": "object",
        "required": [
          "contractVersion",
          "operationId",
          "operation",
          "productId",
          "state",
          "replayed",
          "fundingMode",
          "requestHash",
          "output"
        ],
        "properties": {
          "contractVersion": {
            "const": "2026-07-29.1"
          },
          "operationId": {
            "type": "string",
            "pattern": "^op_[A-Za-z0-9]{20,64}$"
          },
          "operation": {
            "const": "search.query"
          },
          "productId": {
            "enum": [
              "search.web"
            ],
            "description": "Callable public Search operation identity. search.answer remains a released-client compatibility identifier but is not callable."
          },
          "state": {
            "const": "RECEIPTED"
          },
          "replayed": {
            "type": "boolean"
          },
          "fundingMode": {
            "enum": [
              "free",
              "paid"
            ]
          },
          "requestHash": {
            "type": "string",
            "pattern": "^sha256:[a-f0-9]{64}$"
          },
          "output": {
            "type": "object",
            "required": [
              "searchResponse"
            ],
            "properties": {
              "searchResponse": {
                "$ref": "search-response.schema.json"
              },
              "synthesisReport": {
                "$ref": "retrieval-synthesis.schema.json"
              }
            },
            "additionalProperties": false
          },
          "receipt": {
            "$ref": "operation-receipt.schema.json"
          }
        },
        "additionalProperties": false
      },
      "SearchResponse": {
        "$schema": "https://json-schema.org/draft/2020-12/schema",
        "$id": "https://api.clervo.dev/schemas/2026-07-29.1/search-response.schema.json",
        "title": "Clervo deterministic search response",
        "$defs": {
          "score": {
            "type": "object",
            "required": [
              "freshness",
              "authority",
              "relevance",
              "diversity",
              "totalBasisPoints"
            ],
            "properties": {
              "freshness": {
                "type": "integer",
                "minimum": 0,
                "maximum": 100
              },
              "authority": {
                "type": "integer",
                "minimum": 0,
                "maximum": 100
              },
              "relevance": {
                "type": "integer",
                "minimum": 0,
                "maximum": 100
              },
              "diversity": {
                "enum": [
                  40,
                  100
                ]
              },
              "totalBasisPoints": {
                "type": "integer",
                "minimum": 0,
                "maximum": 10000
              }
            },
            "additionalProperties": false
          },
          "result": {
            "type": "object",
            "required": [
              "resultId",
              "sourceId",
              "url",
              "canonicalUrl",
              "hostname",
              "title",
              "snippet",
              "evidenceText",
              "retrievedAt",
              "authorityScore",
              "relevanceScore",
              "rank",
              "score"
            ],
            "properties": {
              "resultId": {
                "type": "string",
                "pattern": "^sr_[A-Za-z0-9]{20,64}$"
              },
              "sourceId": {
                "type": "string",
                "pattern": "^adapter_[a-z0-9][a-z0-9._-]{2,63}$"
              },
              "url": {
                "type": "string",
                "format": "uri",
                "pattern": "^https?://"
              },
              "canonicalUrl": {
                "type": "string",
                "format": "uri",
                "pattern": "^https?://"
              },
              "hostname": {
                "type": "string",
                "minLength": 1,
                "maxLength": 253
              },
              "title": {
                "type": "string",
                "minLength": 1,
                "maxLength": 512
              },
              "snippet": {
                "type": "string",
                "minLength": 1,
                "maxLength": 2000
              },
              "evidenceText": {
                "type": "string",
                "minLength": 1,
                "maxLength": 100000
              },
              "retrievedAt": {
                "type": "string",
                "format": "date-time"
              },
              "publishedAt": {
                "type": "string",
                "format": "date-time"
              },
              "authorityScore": {
                "type": "integer",
                "minimum": 0,
                "maximum": 100
              },
              "relevanceScore": {
                "type": "integer",
                "minimum": 0,
                "maximum": 100
              },
              "rank": {
                "type": "integer",
                "minimum": 1,
                "maximum": 100
              },
              "score": {
                "$ref": "#/$defs/score"
              },
              "attribution": {
                "type": "object",
                "required": [
                  "sourceName",
                  "sourceUrl",
                  "license",
                  "notice"
                ],
                "properties": {
                  "sourceName": {
                    "type": "string",
                    "minLength": 1,
                    "maxLength": 256
                  },
                  "sourceUrl": {
                    "type": "string",
                    "format": "uri",
                    "pattern": "^https?://"
                  },
                  "license": {
                    "type": "string",
                    "minLength": 1,
                    "maxLength": 512
                  },
                  "notice": {
                    "type": "string",
                    "minLength": 1,
                    "maxLength": 2000
                  }
                },
                "additionalProperties": false
              }
            },
            "additionalProperties": false
          },
          "citation": {
            "type": "object",
            "required": [
