          },
          "replayed": {
            "type": "boolean"
          },
          "fundingMode": {
            "enum": [
              "paid",
              "free"
            ]
          },
          "requestHash": {
            "type": "string",
            "pattern": "^sha256:[a-f0-9]{64}$"
          },
          "result": {
            "type": "object",
            "required": [
              "requestedModel",
              "exactModelId",
              "completedAt",
              "usage",
              "output",
              "resultHash"
            ],
            "properties": {
              "requestedModel": {
                "type": "string",
                "minLength": 1,
                "maxLength": 160
              },
              "exactModelId": {
                "type": "string",
